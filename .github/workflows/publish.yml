name: Publish to Chrome Web Store

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: 依存インストール（lockfile 厳密一致のみ許可）
        # lockfile 不整合時の暗黙の install フォールバックを禁止
        # 失敗したら lockfile を手動更新してから再実行すること
        run: bun run deps

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: 同梱する共通問い合わせ部品を確認
        run: bun --bun run sync:support --check

      - name: zip パッケージを作成
        run: |
          zip -r screen-curtain.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh screen-curtain.zip

      - name: 提出するZIPの版・構成・内容を照合
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ['RELEASE_VERSION']
          assert json.loads(Path('package.json').read_text())['version'] == version, 'package version mismatch'
          expected = {'manifest.json'}
          for directory in ('icons', 'src'):
              expected.update(path.as_posix() for path in Path(directory).rglob('*')
                              if path.is_file() and not any(fnmatch.fnmatch(path.name, pattern)
                                                            for pattern in ('*.DS_Store', '*.swp', '*~')))
          package = Path('screen-curtain.zip')
          with ZipFile(package) as archive:
              entries = [entry.filename for entry in archive.infolist() if not entry.is_dir()]
              assert len(entries) == len(set(entries)), 'duplicate ZIP entries'
              assert set(entries) == expected, 'ZIP contents differ from release source'
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['manifest_version'] == 3 and manifest['version'] == version, 'ZIP manifest mismatch'
              for name in expected:
                  assert archive.read(name) == Path(name).read_bytes(), f'ZIP bytes mismatch: {name}'
              for name in manifest['icons'].values():
                  assert name in expected, f'missing icon: {name}'
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          print(f'ZIP verified: version={version}, files={len(expected)}, sha256={digest}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## CWS submission artifact\nVersion: `{version}`\n\nSource: `{os.environ["GITHUB_SHA"]}`\n\nSHA-256: `{digest}`\n')
          PY

      - name: Chrome Web Store にアップロード & 公開
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "screen-curtain.zip"
