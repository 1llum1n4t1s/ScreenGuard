name: Publish to Chrome Web Store

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # SHA 固定でサプライチェーン攻撃耐性を確保（タグはミュータブル）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 11

      - name: Node セットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール（lockfile 厳密一致のみ許可）
        # lockfile 不整合時の暗黙の install フォールバックを禁止
        # 失敗したら lockfile を手動更新してから再実行すること
        run: pnpm install --frozen-lockfile

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r screen-curtain.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh screen-curtain.zip

      - name: Chrome Web Store にアップロード & 公開
        # pnpm install で devDeps に固定した chrome-webstore-upload-cli を使用
        # （`npx --yes @4` 実行時の patch 版サプライチェーン攻撃を回避）。
        # v4 以降は --client-id 等の CLI フラグが廃止され、環境変数 (CLIENT_ID 等) が必須。
        # PUBLISHER_ID も新規必須項目。コマンド (upload/publish) を省略すると
        # upload → publish の両方が自動実行される (旧 --auto-publish 相当)。
        # バイナリ名は `chrome-webstore-upload` (npm パッケージ名 chrome-webstore-upload-cli とは別名)。
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          # 同 version 再 push（release ブランチ再 push 等）では既にアップロード/審査中で
          # cli が exit 1 になる。これは無害な重複なので warning 化して CI を green に保つ。
          set +e
          pnpm exec chrome-webstore-upload \
            --source screen-curtain.zip 2>&1 | tee /tmp/cws.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qiE "ITEM_NOT_UPDATABLE|pending review|ready to publish|cannot be updated|already (published|exists|uploaded)|currently in review|in_review|version already|DUPLICATE_VERSION" /tmp/cws.log; then
              echo "::warning::Chrome Web Store に同 version が既にアップロード/公開済み。CI green 化のため exit 0 扱いに変換します"
            else
              echo "::error::chrome-webstore-upload が同 version 重複以外の理由で失敗しました (rc=$rc)。ログ確認要"
              exit "$rc"
            fi
          fi
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"
